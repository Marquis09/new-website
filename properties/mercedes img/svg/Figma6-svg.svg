<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" style="background-color: #FFFFFF; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrowhead Marker for Process Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0078D4"/>
    </marker>
    
    <!-- Arrowhead Marker for Return Loop -->
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#0078D4"/>
    </marker>

    <!-- Soft Drop Shadow for Figma Canvas Frame -->
    <filter id="frame-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Canvas Border Frame (Figma Component Style) -->
  <rect x="16" y="16" width="868" height="248" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#frame-shadow)"/>

  <!-- ================= PROCESS STEPS ROW ================= -->

  <!-- Step 1: Design Prototype -->
  <text x="180" y="90" font-size="20" font-weight="600" fill="#1A1A1A" text-anchor="middle">Design Prototype</text>

  <!-- Arrow 1 -->
  <line x1="285" y1="83" x2="340" y2="83" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Test with Users -->
  <text x="450" y="90" font-size="20" font-weight="600" fill="#1A1A1A" text-anchor="middle">Test with Users</text>

  <!-- Arrow 2 -->
  <line x1="560" y1="83" x2="615" y2="83" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Live Launch -->
  <text x="720" y="90" font-size="20" font-weight="600" fill="#1A1A1A" text-anchor="middle">Live Launch</text>

  <!-- ================= ITERATIVE LOOP ARROW ================= -->
  <!-- Smooth Curved Path Connecting 'Test with Users' Back to 'Design Prototype' -->
  <path d="M 450 115 L 450 150 Q 450 175 420 175 L 210 175 Q 180 175 180 150 L 180 125" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#loop-arrow)"/>

  <!-- Loop Text Label -->
  <rect x="235" y="162" width="160" height="26" rx="4" fill="#FFFFFF"/>
  <text x="315" y="180" font-size="15" font-weight="500" fill="#4A4A4A" text-anchor="middle">Iterate and Refine</text>

</svg>
