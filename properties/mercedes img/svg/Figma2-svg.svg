<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" width="100%" height="100%" style="background-color: #F8F9FA; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 3-Column Container Frame (Width: 960px, Offset Left: 30px, Top: 20px) -->
  <g transform="translate(30, 20)">

    <!-- ================= CARD 1: PCP ================= -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <!-- Card Outer Frame (300 x 360, Radius: 8px) -->
      <rect x="0" y="0" width="300" height="360" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
      
      <!-- Content Container (Padding: 24px) -->
      <g transform="translate(24, 24)">
        <!-- Title -->
        <text x="0" y="20" font-size="20" font-weight="600" fill="#1A1A1A">PCP</text>
        
        <!-- Attributes List (Vertical gap mapping) -->
        <!-- 1. Monthly Cost -->
        <g transform="translate(0, 48)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Monthly Cost</text>
          <text x="0" y="30" font-size="16" font-weight="600" fill="#1A1A1A">£271.50</text>
        </g>
        
        <!-- 2. Ownership -->
        <g transform="translate(0, 98)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Ownership</text>
          <text x="0" y="30" font-size="15" font-weight="400" fill="#4A4A4A">Optional at end</text>
        </g>
        
        <!-- 3. Mileage -->
        <g transform="translate(0, 148)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Mileage</text>
          <text x="0" y="30" font-size="15" font-weight="400" fill="#4A4A4A">10,000 miles / year</text>
        </g>

        <!-- 4. Flexibility -->
        <g transform="translate(0, 198)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Flexibility</text>
          <text x="0" y="30" font-size="15" font-weight="600" fill="#0078D4">High</text>
        </g>

        <!-- CTA Button -->
        <g transform="translate(0, 252)" cursor="pointer">
          <rect x="0" y="0" width="110" height="40" rx="6" fill="#0078D4"/>
          <text x="55" y="24" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Learn more</text>
        </g>
      </g>
    </g>

    <!-- ================= CARD 2: HIRE PURCHASE ================= -->
    <g transform="translate(324, 0)" filter="url(#card-shadow)">
      <!-- Card Outer Frame -->
      <rect x="0" y="0" width="300" height="360" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
      
      <!-- Content Container -->
      <g transform="translate(24, 24)">
        <!-- Title -->
        <text x="0" y="20" font-size="20" font-weight="600" fill="#1A1A1A">Hire Purchase</text>
        
        <!-- 1. Monthly Cost -->
        <g transform="translate(0, 48)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Monthly Cost</text>
          <text x="0" y="30" font-size="16" font-weight="600" fill="#1A1A1A">£340.00</text>
        </g>
        
        <!-- 2. Ownership -->
        <g transform="translate(0, 98)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Ownership</text>
          <text x="0" y="30" font-size="15" font-weight="400" fill="#4A4A4A">You own the car</text>
        </g>
        
        <!-- 3. Mileage -->
        <g transform="translate(0, 148)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Mileage</text>
          <text x="0" y="30" font-size="15" font-weight="400" fill="#4A4A4A">Unlimited</text>
        </g>

        <!-- 4. Flexibility -->
        <g transform="translate(0, 198)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Flexibility</text>
          <text x="0" y="30" font-size="15" font-weight="600" fill="#2E7D32">Medium</text>
        </g>

        <!-- CTA Button -->
        <g transform="translate(0, 252)" cursor="pointer">
          <rect x="0" y="0" width="110" height="40" rx="6" fill="#0078D4"/>
          <text x="55" y="24" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Learn more</text>
        </g>
      </g>
    </g>

    <!-- ================= CARD 3: LEASING ================= -->
    <g transform="translate(648, 0)" filter="url(#card-shadow)">
      <!-- Card Outer Frame -->
      <rect x="0" y="0" width="300" height="360" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
      
      <!-- Content Container -->
      <g transform="translate(24, 24)">
        <!-- Title -->
        <text x="0" y="20" font-size="20" font-weight="600" fill="#1A1A1A">Leasing</text>
        
        <!-- 1. Monthly Cost -->
        <g transform="translate(0, 48)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Monthly Cost</text>
          <text x="0" y="30" font-size="16" font-weight="600" fill="#1A1A1A">£215.00</text>
        </g>
        
        <!-- 2. Ownership -->
        <g transform="translate(0, 98)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Ownership</text>
          <text x="0" y="30" font-size="15" font-weight="400" fill="#4A4A4A">You never own the car</text>
        </g>
        
        <!-- 3. Mileage -->
        <g transform="translate(0, 148)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Mileage</text>
          <text x="0" y="30" font-size="15" font-weight="400" fill="#4A4A4A">10,000 miles / year</text>
        </g>

        <!-- 4. Flexibility -->
        <g transform="translate(0, 198)">
          <text x="0" y="12" font-size="12" font-weight="500" fill="#717171" text-transform="uppercase" letter-spacing="0.05em">Flexibility</text>
          <text x="0" y="30" font-size="15" font-weight="600" fill="#C62828">Low</text>
        </g>

        <!-- CTA Button -->
        <g transform="translate(0, 252)" cursor="pointer">
          <rect x="0" y="0" width="110" height="40" rx="6" fill="#0078D4"/>
          <text x="55" y="24" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Learn more</text>
        </g>
      </g>
    </g>

  </g>
</svg>
