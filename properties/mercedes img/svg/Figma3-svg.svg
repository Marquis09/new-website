<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="100%" height="100%" style="background-color: #F8F9FA; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Screen Shadow -->
    <filter id="screen-shadow" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Active Card Ring Shadow -->
    <filter id="active-card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0078D4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Flow Container (3 Screens, 360px wide, 32px spacing) -->
  <g transform="translate(32, 40)">

    <!-- ================= SCREEN 1: BUDGET SELECTOR ================= -->
    <g transform="translate(0, 0)" filter="url(#screen-shadow)">
      <!-- Screen Outer Frame (360 x 640, Corner Radius: 12px) -->
      <rect x="0" y="0" width="360" height="640" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
      
      <!-- Content Container (Padding: 32px) -->
      <g transform="translate(32, 48)">
        
        <!-- Step Progress Indicator -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" font-size="12" font-weight="600" fill="#0078D4" letter-spacing="0.05em">STEP 1 OF 3</text>
          <!-- Progress Bar Track -->
          <rect x="0" y="10" width="296" height="4" rx="2" fill="#E5E5E5"/>
          <rect x="0" y="10" width="98" height="4" rx="2" fill="#0078D4"/>
        </g>

        <!-- Header Title -->
        <text x="0" y="56" font-size="24" font-weight="600" fill="#1A1A1A">What’s your</text>
        <text x="0" y="86" font-size="24" font-weight="600" fill="#1A1A1A">monthly budget?</text>

        <!-- Dynamic Value Display -->
        <g transform="translate(0, 160)">
          <text x="0" y="28" font-size="32" font-weight="600" fill="#1A1A1A">£271.50</text>
          <text x="0" y="50" font-size="13" font-weight="400" fill="#717171">per month</text>
        </g>

        <!-- Slider Input Component -->
        <g transform="translate(0, 260)">
          <!-- Track Background -->
          <rect x="0" y="8" width="296" height="6" rx="3" fill="#E5E5E5"/>
          <!-- Active Track -->
          <rect x="0" y="8" width="105" height="6" rx="3" fill="#0078D4"/>
          <!-- Slider Handle (Thumb) -->
          <circle cx="105" cy="11" r="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="4"/>
          
          <!-- Range Indicators -->
          <text x="0" y="38" font-size="13" font-weight="400" fill="#717171">£150</text>
          <text x="296" y="38" font-size="13" font-weight="400" fill="#717171" text-anchor="end">£600</text>
        </g>

        <!-- Bottom Navigation CTA -->
        <g transform="translate(0, 480)" cursor="pointer">
          <rect x="196" y="0" width="100" height="48" rx="8" fill="#0078D4"/>
          <text x="246" y="29" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Next</text>
        </g>

      </g>
    </g>


    <!-- ================= SCREEN 2: MILEAGE SELECTOR ================= -->
    <g transform="translate(392, 0)" filter="url(#screen-shadow)">
      <!-- Screen Outer Frame -->
      <rect x="0" y="0" width="360" height="640" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
      
      <!-- Content Container -->
      <g transform="translate(32, 48)">
        
        <!-- Step Progress Indicator -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" font-size="12" font-weight="600" fill="#0078D4" letter-spacing="0.05em">STEP 2 OF 3</text>
          <!-- Progress Bar Track -->
          <rect x="0" y="10" width="296" height="4" rx="2" fill="#E5E5E5"/>
          <rect x="0" y="10" width="196" height="4" rx="2" fill="#0078D4"/>
        </g>

        <!-- Header Title -->
        <text x="0" y="56" font-size="24" font-weight="600" fill="#1A1A1A">How many miles do</text>
        <text x="0" y="86" font-size="24" font-weight="600" fill="#1A1A1A">you drive yearly?</text>

        <!-- Dynamic Value Display -->
        <g transform="translate(0, 160)">
          <text x="0" y="28" font-size="24" font-weight="600" fill="#1A1A1A">10,000 miles <tspan font-size="18" font-weight="400" fill="#717171">/ year</tspan></text>
        </g>

        <!-- Slider Input Component -->
        <g transform="translate(0, 260)">
          <!-- Track Background -->
          <rect x="0" y="8" width="296" height="6" rx="3" fill="#E5E5E5"/>
          <!-- Active Track -->
          <rect x="0" y="8" width="80" height="6" rx="3" fill="#0078D4"/>
          <!-- Slider Handle (Thumb) -->
          <circle cx="80" cy="11" r="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="4"/>
          
          <!-- Range Indicators -->
          <text x="0" y="38" font-size="13" font-weight="400" fill="#717171">6,000</text>
          <text x="296" y="38" font-size="13" font-weight="400" fill="#717171" text-anchor="end">40,000</text>
        </g>

        <!-- Bottom Navigation CTA -->
        <g transform="translate(0, 480)" cursor="pointer">
          <!-- Back Link -->
          <text x="0" y="29" font-size="15" font-weight="500" fill="#717171">Back</text>

          <!-- Next Button -->
          <rect x="196" y="0" width="100" height="48" rx="8" fill="#0078D4"/>
          <text x="246" y="29" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Next</text>
        </g>

      </g>
    </g>


    <!-- ================= SCREEN 3: OWNERSHIP PREFERENCE ================= -->
    <g transform="translate(784, 0)" filter="url(#screen-shadow)">
      <!-- Screen Outer Frame -->
      <rect x="0" y="0" width="360" height="640" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
      
      <!-- Content Container -->
      <g transform="translate(32, 48)">
        
        <!-- Step Progress Indicator -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" font-size="12" font-weight="600" fill="#0078D4" letter-spacing="0.05em">STEP 3 OF 3</text>
          <!-- Progress Bar Track -->
          <rect x="0" y="10" width="296" height="4" rx="2" fill="#E5E5E5"/>
          <rect x="0" y="10" width="296" height="4" rx="2" fill="#0078D4"/>
        </g>

        <!-- Header Title -->
        <text x="0" y="56" font-size="24" font-weight="600" fill="#1A1A1A">Do you want to</text>
        <text x="0" y="86" font-size="24" font-weight="600" fill="#1A1A1A">own the car?</text>

        <!-- Option Cards Group -->
        <g transform="translate(0, 120)">
          
          <!-- Card 1 — PCP (Selected / Active State) -->
          <g transform="translate(0, 0)" cursor="pointer" filter="url(#active-card-shadow)">
            <rect x="0" y="0" width="296" height="80" rx="8" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
            <text x="16" y="32" font-size="16" font-weight="600" fill="#1A1A1A">PCP</text>
            <text x="16" y="54" font-size="13" font-weight="400" fill="#4A4A4A">Optional ownership at end</text>
            <!-- Checkmark Indicator -->
            <circle cx="264" cy="40" r="10" fill="#0078D4"/>
            <path d="M259 40 L262.5 43.5 L269 37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>

          <!-- Card 2 — Hire Purchase -->
          <g transform="translate(0, 96)" cursor="pointer">
            <rect x="0" y="0" width="296" height="80" rx="8" fill="#F7F7F7" stroke="#E5E5E5" stroke-width="1"/>
            <text x="16" y="32" font-size="16" font-weight="600" fill="#1A1A1A">Hire Purchase</text>
            <text x="16" y="54" font-size="13" font-weight="400" fill="#4A4A4A">You own the car</text>
          </g>

          <!-- Card 3 — Leasing -->
          <g transform="translate(0, 192)" cursor="pointer">
            <rect x="0" y="0" width="296" height="80" rx="8" fill="#F7F7F7" stroke="#E5E5E5" stroke-width="1"/>
            <text x="16" y="32" font-size="16" font-weight="600" fill="#1A1A1A">Leasing</text>
            <text x="16" y="54" font-size="13" font-weight="400" fill="#4A4A4A">You never own the car</text>
          </g>

        </g>

        <!-- Final CTA Button -->
        <g transform="translate(0, 480)" cursor="pointer">
          <rect x="0" y="0" width="296" height="48" rx="8" fill="#0078D4"/>
          <text x="148" y="29" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">See my recommended option</text>
        </g>

      </g>
    </g>

  </g>
</svg>
